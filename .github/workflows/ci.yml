name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]  # oldest supported and newest stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,api]" ruff
      - run: ruff check .
      - run: pytest -q
      - name: Retrieval eval (fails on any ACL leak)
        run: |
          ragkit ingest sample_docs
          python eval/run_eval.py
