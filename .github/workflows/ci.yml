name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]" ruff
      - run: ruff check .
      - run: pytest -q
      - name: Retrieval eval (fails on any ACL leak)
        run: |
          ragkit ingest sample_docs
          python eval/run_eval.py
