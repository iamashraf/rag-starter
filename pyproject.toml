[project]
name = "ragkit"
version = "0.1.0"
description = "Starter scaffold for a permission-aware RAG system over internal company knowledge"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
rerank = ["sentence-transformers>=3.0"]
pdf = ["pypdf>=4.0"]
eval = ["ragas>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
ragkit = "ragkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]
# B008: FastAPI's Depends() default is the idiom. B023: emit() in chunking.py runs inside the loop iteration that defines it.
ignore = ["B008", "B023"]
