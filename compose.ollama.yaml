# Local Ollama for the Ollama setup. Start it with:
#   podman compose -f compose.ollama.yaml up -d      (or: docker compose ...)
#
# Models live in a named volume. To reuse an existing one, set its name in .env:
#   RAGKIT_OLLAMA_VOLUME=my-existing-ollama-volume
# Do not run two Ollama containers on the same volume at once: a model pull from each can corrupt it.
services:
  ollama:
    image: docker.io/ollama/ollama:0.40.11
    ports:
      # Ollama has no authentication, so publish on localhost only.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ollama_data:
    name: ${RAGKIT_OLLAMA_VOLUME:-ragkit_ollama}
